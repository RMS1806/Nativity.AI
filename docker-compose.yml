
services:
  # Redis — Celery broker + job status cache
  redis:
    image: redis:7-alpine
    container_name: nativity-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: dockerfile
      target: runtime
    container_name: nativity-api-dev
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Cloudflare R2
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      # Supabase PostgreSQL
      - DATABASE_URL=${DATABASE_URL}
      # AI / Auth
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CLERK_ISSUER_URL=${CLERK_ISSUER_URL}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Celery worker — processes video localization jobs
  worker:
    build:
      context: ./backend
      dockerfile: dockerfile.worker
      target: worker
    container_name: nativity-worker-dev
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Cloudflare R2
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      # Supabase PostgreSQL
      - DATABASE_URL=${DATABASE_URL}
      # AI
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Run Celery worker directly (concurrency=1 for dev — safe on RAM)
    command: [
      "celery", "-A", "celery_app", "worker",
      "--loglevel=info", "--concurrency=1",
      "-Q", "high,default,low"
    ]

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      target: base
    container_name: nativity-frontend-dev
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_dev_data:
    driver: local

networks:
  default:
    name: nativity-dev-network
    driver: bridge