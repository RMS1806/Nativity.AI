services:
  # ────────────────────────────────────────────────────────
  # 1. Web API Service (FastAPI)
  # ────────────────────────────────────────────────────────
  - type: web
    name: nativity-api
    env: python
    buildCommand: |
      apt-get update -qq && apt-get install -y --no-install-recommends ffmpeg
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: CLERK_ISSUER_URL
        sync: false

  # ────────────────────────────────────────────────────────
  # 2. Background Worker Service (disabled — processing now
  #    runs as FastAPI background_tasks in nativity-api,
  #    same as the original MVP approach. Re-enable if you
  #    want to split processing back to a separate service.)
  # ────────────────────────────────────────────────────────
  # - type: worker
  #   name: nativity-worker
  #   env: docker
  #   dockerfilePath: ./backend/dockerfile.worker
  #   dockerContext: ./backend
  #   dockerCommand: "celery -A celery_app worker --loglevel=info --concurrency=1 -Q high,default,low"

  # ────────────────────────────────────────────────────────
  # 3. Frontend Service (Next.js)
  # ────────────────────────────────────────────────────────
  - type: web
    name: nativity-frontend
    env: docker
    dockerfilePath: ./frontend/dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false   # set manually after nativity-api's first deploy, e.g. https://nativity-api.onrender.com
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false