[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:backend]
directory=/app/backend
command=/opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:worker]
directory=/app/backend
command=/opt/venv/bin/celery -A celery_app worker --loglevel=info --concurrency=1 -Q high,default,low
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:frontend]
directory=/app/frontend
command=npm start
environment=PORT="3000",HOSTNAME="0.0.0.0"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:nginx]
command=/bin/sh -c "until curl -sf http://127.0.0.1:8000/api/health > /dev/null 2>&1; do sleep 2; done && nginx -c /etc/nginx/nginx.conf"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
